name: Fetch DWD Pollen Data

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC — after DWD morning update
    - cron: '0 17 * * *'  # 17:00 UTC — after DWD evening update
  workflow_dispatch:       # manual trigger

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch DWD pollen JSON
        run: |
          mkdir -p data
          curl -fsSL https://opendata.dwd.de/climate_environment/health/alerts/s31fg.json \
            -o data/dwd-pollen.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dwd-pollen.json
          git diff --staged --quiet || git commit -m "chore: update DWD pollen data"
          git push
